[project]
name = "era-arm"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "kritin", email = "kritinkalani26@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "pyserial>=3.5",
]

[project.scripts]
era-arm = "era_arm:main"

# Heavy / hardware-only dependencies, kept out of the default install so the core
# package stays light and mock-testable. Install per machine when needed, e.g.
# `uv sync --extra camera` or, on the GPU box, `uv sync --extra train`.
[project.optional-dependencies]
camera = ["opencv-python>=4.9"]   # OpenCVCamera (real USB webcam; native Ubuntu)
teleop = ["pynput>=1.7"]           # KeyboardTeleop (needs a terminal/display)
train = ["lerobot"]                # policy training/eval (LeRobot + torch; needs CUDA)

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
